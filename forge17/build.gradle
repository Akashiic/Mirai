// ==================== Tasks ====================

task deleteResources(type: Delete) {
    delete file("build/resources/main")
}

processResources {
    dependsOn(copyCoreResources)
    dependsOn(convertJsonToLang)
    // dependsOn(copyCommonLoaderResources)

    from(project(":common").file("src/main/resources/${gradle.ext.accessWidenerVersion}.distanthorizons_at.cfg")) {
        into 'META-INF'
    }
}

tasks.named('runClient') {
    dependsOn(copyCoreResources)
    // dependsOn(copyCommonLoaderResources)
    finalizedBy(deleteResources)
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// The upstream legacy artifact contains the optional LWJGL3 backend classes too.
// Supply their compile-only type hierarchy to the bytecode transformer without
// adding LWJGL3 libraries/natives to the mod or changing the selected backend.
tasks.named('downgradeJar') {
    classpath = classpath.plus(project(":common").configurations.lwjgl3CompileClasspath)
}
